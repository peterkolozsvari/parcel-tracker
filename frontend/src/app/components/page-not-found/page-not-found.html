<main class="not-found container">
  <section class="not-found-content">
    <p class="error-code">404</p>

    <h1>{{ 'Ez a cím most rajtunk is kifogott.' | translate }}</h1>

    <p class="error-description">
      {{ 'A keresett oldal nem található.' | translate }}
    </p>

    <a class="home-link" routerLink="/home">
      {{ 'Vissza a főoldalra' | translate }}
    </a>
  </section>

  <img
    class="not-found-image"
    src="/pagenotfound.png"
    [alt]="'Tanácstalan futár térképpel egy útelágazásnál' | translate"
  >
</main>
