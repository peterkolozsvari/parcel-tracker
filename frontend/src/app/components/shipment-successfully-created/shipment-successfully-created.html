<div class="container py-5">
  <div class="card mx-auto text-center p-4" style="max-width: 600px;">
    <div class="card-body">
      <h1 class="h3 mb-3">Sikeres küldeményrögzítés!</h1>

      <p class="text-muted mb-4">
        Küldeményedet rögzítettük a rendszerben.
        Az alábbi követési számmal ellenőrizheted az állapotát.
      </p>

      <p class="mb-2">Követési szám:</p>

      <div class="border rounded p-3 mb-3">
        <span class="fs-4 fw-bold text-break">
          {{ trackingNumber }}
        </span>
      </div>


      <ion-icon
        name="copy-outline"
        role="button"
        tabindex="0"
        aria-label="Követési szám másolása"
        title="Követési szám másolása"
        style="cursor: pointer; font-size: 24px;"
        (click)="copyTrackingNumber()"
        (keydown.enter)="copyTrackingNumber()"
        (keydown.space)="$event.preventDefault(); copyTrackingNumber()"
      ></ion-icon>

      <p class="text-muted mb-4">
        Őrizd meg a követési számot, és oszd meg a címzettel is.
      </p>

      <a
        routerLink="/shipments/new"
        class="btn btn-primary"
      >
        Új küldemény feladása
      </a>
    </div>
  </div>
</div>
