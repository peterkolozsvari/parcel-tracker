<header class="site-header">
  <nav class="container navbar-content" aria-label="Fő navigáció">
    <a class="brand" routerLink="/home">
      <img class="brand-icon" src="/logo.png" alt="">
      <span class="brand-name">Parcel<span>Tracker</span></span>
    </a>

    <button
      class="menu-toggle"
      type="button"
      aria-label="Navigációs menü"
      aria-controls="navbar-menu"
      [attr.aria-expanded]="menuOpen()"
      (click)="toggleMenu()"
    >
      <span></span>
      <span></span>
      <span></span>
    </button>

    <div
      id="navbar-menu"
      class="navbar-menu"
      [class.is-open]="menuOpen()"
    >
      <a
        class="nav-link"
        routerLink="/shipments/new"
        routerLinkActive="is-active"
      >
        Csomagfeladás
      </a>

      <div class="navbar-actions">
        <div class="language-switch" role="group" aria-label="Nyelvválasztás">
          <button
            type="button"
            class="language-button"
            [class.is-selected]="language() === 'hu'"
            [attr.aria-pressed]="language() === 'hu'"
            (click)="changeLanguage('hu')"
          >
            HU
          </button>

          <button
            type="button"
            class="language-button"
            [class.is-selected]="language() === 'en'"
            [attr.aria-pressed]="language() === 'en'"
            (click)="changeLanguage('en')"
          >
            EN
          </button>
        </div>

        @if (authService.sessionChecked()) {
          @if (authService.currentUser(); as user) {
            <div class="profile-menu">
              <button
                #profileToggle
                type="button"
                class="profile-button"
                aria-label="Profilmenü"
                aria-controls="profile-dropdown"
                [attr.aria-expanded]="profileMenuOpen()"
                [title]="user.fullName"
                (click)="toggleProfileMenu()"
              >
                <svg
                  width="44"
                  height="44"
                  viewBox="0 0 48 48"
                  fill="none"
                  aria-hidden="true"
                >
                  <circle cx="24" cy="24" r="23" fill="currentColor" opacity="0.12"/>
                  <circle cx="24" cy="18" r="7" fill="currentColor"/>
                  <path
                    d="M11 38C11 30.8 16.8 27 24 27S37 30.8 37 38"
                    fill="currentColor"
                  />
                </svg>
              </button>

              @if (profileMenuOpen()) {
                <div
                  id="profile-dropdown"
                  class="profile-dropdown"
                  (keydown.escape)="closeProfileMenu(); profileToggle.focus()"
                >
                  <div class="profile-dropdown-header">
                    {{ user.fullName }}
                  </div>

                  <button type="button" class="profile-menu-item">
                    Profilom
                  </button>

                  <button type="button" class="profile-menu-item">
                    Csomagjaim
                  </button>

                  <div class="profile-menu-divider"></div>

                  <button
                    type="button"
                    class="profile-menu-item logout-item"
                    (click)="logout()"
                  >
                    Kijelentkezés
                  </button>
                </div>
              }
            </div>
          } @else {
            <a class="login-link" routerLink="/login">
              {{ language() === 'hu' ? 'Bejelentkezés' : 'Sign in' }}
            </a>
          }
        }
      </div>
    </div>
  </nav>
</header>
