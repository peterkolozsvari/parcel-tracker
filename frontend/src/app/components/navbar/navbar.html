<header class="site-header">
  <nav class="container navbar-content" aria-label="Fő navigáció">
    <a class="brand" routerLink="/home">
      Parcel<span>Tracker</span>
    </a>

    <button
      class="menu-toggle"
      type="button"
      aria-label="Navigációs menü"
      aria-controls="navbar-menu"
      [attr.aria-expanded]="menuOpen()"
      (click)="toggleMenu()"
    >
      <span></span>
      <span></span>
      <span></span>
    </button>

    <div
      id="navbar-menu"
      class="navbar-menu"
      [class.is-open]="menuOpen()"
    >
      <a
        class="nav-link"
        routerLink="/shipments/new"
        routerLinkActive="is-active"
      >
        Csomagfeladás
      </a>

      <div class="navbar-actions">
        <div class="language-switch" role="group" aria-label="Nyelvválasztás">
          <button
            type="button"
            class="language-button"
            [class.is-selected]="language() === 'hu'"
            [attr.aria-pressed]="language() === 'hu'"
            (click)="changeLanguage('hu')"
          >
            HU
          </button>

          <button
            type="button"
            class="language-button"
            [class.is-selected]="language() === 'en'"
            [attr.aria-pressed]="language() === 'en'"
            (click)="changeLanguage('en')"
          >
            EN
          </button>
        </div>

        <a class="login-link" routerLink="/login">
          {{ language() === 'hu' ? 'Bejelentkezés' : 'Sign in' }}
        </a>
      </div>
    </div>
  </nav>
</header>
