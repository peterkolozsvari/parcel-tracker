<div class="login-page">
  <div class="login-container">
    <div class="login-card">
      <div class="login-header">
        <h2>Üdvözöljük a ParcelTracker felületén!</h2>
        <p>Jelentkezz be a csomagjaid kezeléséhez</p>
      </div>

      <form class="login-form" (submit)="$event.preventDefault(); onSubmit()">
        <div class="form-group">
          <div class="input-wrapper">
            <input
              type="email"
              id="email"
              name="email"
              required
              autocomplete="username"
              autocapitalize="none"
              spellcheck="false"
              placeholder=" "
            >
            <label for="email">Email-cím</label>
            <span class="focus-border"></span>
          </div>
        </div>

        <div class="form-group">
          <div class="input-wrapper password-wrapper">
            <input
              #passwordInput
              type="password"
              id="password"
              name="password"
              required
              autocomplete="current-password"
              placeholder=" "
            >
            <label for="password">Jelszó</label>

            <button
              type="button"
              class="password-toggle"
              [attr.aria-label]="passwordInput.type === 'password' ? 'Show password' : 'Hide password'"
              [attr.aria-pressed]="passwordInput.type === 'text'"
              (click)="passwordInput.type = passwordInput.type === 'password' ? 'text' : 'password'"
            >
              <svg
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="1.5"
                aria-hidden="true"
              >
                <path
                  stroke-linecap="round"
                  stroke-linejoin="round"
                  d="M2.458 12C3.732 7.943 7.523 5 12 5s8.268 2.943 9.542 7C20.268 16.057 16.477 19 12 19s-8.268-2.943-9.542-7Z"
                />
                <circle cx="12" cy="12" r="3"/>
              </svg>
            </button>

            <span class="focus-border"></span>
          </div>
        </div>

        <div class="form-options">
          <label class="remember-wrapper">
            <input type="checkbox" id="remember" name="remember">
            <span class="checkbox-label">
              <span class="checkmark"></span>
              Maradjak bejelentkezve
            </span>
          </label>

          <a
            href="#"
            class="forgot-password"
            (click)="$event.preventDefault()"
          >
            Elfelejtetted a jelszavad?
          </a>
        </div>

        <button type="submit" class="login-btn">
          Bejelentkezés
        </button>
      </form>

      <div class="divider">
        <span>vagy jelentkezz be ezzel</span>
      </div>

      <div class="social-login">
        <button type="button" class="social-btn">
          <svg class="social-icon" viewBox="0 0 24 24" aria-hidden="true">
            <path
              fill="#4285f4"
              d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"
            />
            <path
              fill="#34a853"
              d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"
            />
            <path
              fill="#fbbc05"
              d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l3.66-2.84z"
            />
            <path
              fill="#ea4335"
              d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z"
            />
          </svg>
          Google
        </button>

        <button type="button" class="social-btn">
          <svg
            class="social-icon"
            viewBox="0 0 24 24"
            fill="currentColor"
            aria-hidden="true"
          >
            <path
              d="M12 0C5.37 0 0 5.373 0 12c0 5.302 3.438 9.8 8.207 11.387.599.111.793-.261.793-.577v-2.234c-3.338.726-4.033-1.416-4.033-1.416-.546-1.387-1.333-1.756-1.333-1.756-1.089-.745.083-.729.083-.729 1.205.084 1.839 1.237 1.839 1.237 1.07 1.834 2.807 1.304 3.492.997.107-.775.418-1.305.762-1.604-2.665-.305-5.467-1.334-5.467-5.931 0-1.311.469-2.381 1.236-3.221-.124-.303-.535-1.524.117-3.176 0 0 1.008-.322 3.301 1.23.957-.266 1.983-.399 3.003-.404 1.02.005 2.047.138 3.006.404 2.291-1.552 3.297-1.23 3.297-1.23.653 1.653.242 2.874.118 3.176.77.84 1.235 1.911 1.235 3.221 0 4.609-2.807 5.624-5.479 5.921.43.372.823 1.102.823 2.222v3.293c0 .319.192.694.801.576C20.562 21.796 24 17.299 24 12 24 5.373 18.627 0 12 0z"
            />
          </svg>
          GitHub
        </button>
      </div>

      <div class="signup-link">
        <p>
          Még nincs fiókod?
          <a href="#" (click)="$event.preventDefault()">Regisztrálj!</a>
        </p>
      </div>
    </div>
  </div>
</div>
