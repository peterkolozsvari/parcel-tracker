name: parcel-tracker-tests
services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_DB: parcel_tracker_test
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: test-only-password
    ports:
      - "127.0.0.1:55432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d parcel_tracker_test"]
      interval: 2s
      timeout: 5s
      retries: 20
